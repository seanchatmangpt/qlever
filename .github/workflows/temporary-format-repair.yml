name: Temporary exact-format repair

on:
  push:
    branches: [ agent/finish-qlever-wip ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-qlever-wip
      - name: Install clang-format 16
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16
          sudo apt-get install -y clang-format-16
      - name: Format exact failed surface
        run: |
          clang-format-16 -i \
            src/util/http/MediaTypes.cpp \
            src/libqlever/qlever_c_test.cpp \
            src/libqlever/Qlever.cpp \
            src/engine/ShExParser.h \
            src/engine/Server.cpp \
            src/engine/ExportQueryExecutionTrees.cpp \
            src/engine/DatalogParser.h \
            src/engine/RdfXmlParser.h \
            test/ServerTest.cpp \
            test/ExportQueryExecutionTreesTest.cpp \
            test/AcceptHeaderTest.cpp
          ./misc/format-check.sh
      - name: Commit only formatting repair
        run: |
          if git diff --quiet -- \
            src/util/http/MediaTypes.cpp \
            src/libqlever/qlever_c_test.cpp \
            src/libqlever/Qlever.cpp \
            src/engine/ShExParser.h \
            src/engine/Server.cpp \
            src/engine/ExportQueryExecutionTrees.cpp \
            src/engine/DatalogParser.h \
            src/engine/RdfXmlParser.h \
            test/ServerTest.cpp \
            test/ExportQueryExecutionTreesTest.cpp \
            test/AcceptHeaderTest.cpp; then
            echo 'No formatting changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/util/http/MediaTypes.cpp \
            src/libqlever/qlever_c_test.cpp \
            src/libqlever/Qlever.cpp \
            src/engine/ShExParser.h \
            src/engine/Server.cpp \
            src/engine/ExportQueryExecutionTrees.cpp \
            src/engine/DatalogParser.h \
            src/engine/RdfXmlParser.h \
            test/ServerTest.cpp \
            test/ExportQueryExecutionTreesTest.cpp \
            test/AcceptHeaderTest.cpp
          git commit -m 'Format merged custom QLever integration surface'
          git push origin HEAD:agent/finish-qlever-wip
