[package]
name = "qlever"
version = "0.1.0"
edition = "2021"
description = "Safe Rust bindings for the QLever embedded SPARQL engine"
license = "Apache-2.0"
repository = "https://github.com/ad-freiburg/qlever"

[dependencies]
qlever-sys = { path = "../qlever-sys" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[bench]]
name = "qlever_bench"
harness = false
